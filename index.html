<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CertKeeper</title>
<meta name="description" content="Track certification renewals, reminders and audit proof in one place.">
<meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1419" media="(prefers-color-scheme: dark)">
<!-- Home-screen app: icon, name, and opening full-screen without browser bars -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z' fill='%230f5c8c'/%3E%3Cpath d='m8.5 12 2.5 2.5 4.5-5' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<script>
  // Apply the saved Light/Dark choice before anything draws, so there's no flash.
  try { const t = localStorage.getItem('ck-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
</script>
</head>

<div id="offline-bar" hidden>Offline · showing what’s saved on this device</div>
<main id="view" class="container"><p class="loading">Loading…</p></main>

<script src="firebase-config.js"></script>
<script src="dates.js"></script>
<script src="templates.js"></script>
<script src="store.js"></script>
<script src="scan.js"></script>
<script src="app.js"></script>

</html>
